# 单篇文章：翻译 / 改写 → HTML（article_to_target_page.py）
# 默认路径：tools/i18n/article_to_target_page.yaml
# 用法：在仓库根目录执行
#   python3 tools/i18n/article_to_target_page.py
# 或指定其它文件：
#   python3 tools/i18n/article_to_target_page.py --article-config path/to/job.yaml
# 命令行参数会覆盖此处同名字段。

# DeepSeek / OpenAI 等与 translate.py 共用的配置
translate_config: tools/url-translate/config.yaml

# 输入输出（路径相对本 YAML 文件、仓库根或当前工作目录均可解析）
# input: drafts/companian.md
target: en
source: auto
# output: build/my-article.en.html   # 可选；不填则 {input 主名}.{target}.html

# 选用后端（也可只在 translate_config 里设）
backend: deepseek

scope: article   # article | full

# LLM 改写（需 deepseek 等；simple 无效）
rewrite: false
visitor_voice: false
# 自定义文风说明（非空时优先于 visitor_voice 内置文案；可与 rewrite 同用）
# rewrite_extra_instructions: |
#   - Your bullet points here.

# 写盘后是否调用 tools/deploy/deploy.py
deploy: false
deploy_auto: false    # true 时传给 deploy --auto
# deploy_target: blog   # blog | guides；未设 deploy_auto 且要部署时使用

quiet: false
